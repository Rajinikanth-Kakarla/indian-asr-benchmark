
name: Bug report
description: Report a bug or incorrect result
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Report reproducible problems with the Indian ASR Benchmark pipeline."

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What went wrong?
      placeholder: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the commands and steps that reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant package versions.
      placeholder: "Python 3.x, Windows 11"
    validations:
      required: true
